name: Sync photo manifest

on:
  push:
    paths:
      - "photos/**"
      - "tools/sync_photos.py"
      - ".github/workflows/sync-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate manifest
        run: python tools/sync_photos.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- photos/manifest.json; then
            echo "manifest unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add photos/manifest.json
            git commit -m "chore: sync photos manifest"
            git push
          fi
