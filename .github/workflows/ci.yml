name: CI

on:
  push:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install npm deps
        run: npm ci
      - name: Install Pillow (serve.py 读 manifest)
        run: pip install "Pillow>=11"
      # 护栏：母版既不得带 GPS，也不得超过长边上限。
      # 背景——手机原图可达 6000–8000px / 数十 MB，而站内展示只用 1600px 的 medium，
      # 原图从不被访客请求（src/util.js 的 heroSrc / lightboxSrc 只取 medium|thumb）。
      # 两者都是「加入新照片时才会触发」的检查，放在 lint 之前，失败得最早最省时。
      - name: Verify photo privacy (no GPS EXIF)
        run: python tools/sanitize_photos.py --check
      - name: Verify photo master size cap
        run: python tools/downscale_photos.py --check
      - name: ESLint
        run: npm run lint:js
      - name: Stylelint
        run: npm run lint:css
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke
        run: npm run test:e2e
      - name: Lighthouse CI
        run: npm run lhci
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
