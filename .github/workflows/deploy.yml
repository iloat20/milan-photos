# 站点部署：构建 dist → 作为 GitHub Pages 产物发布。
#
# 与旧模式（Pages 直接发布 main 分支根目录）的区别：
#   仓库里是**源码**，线上是**构建产物**——访客不再下载未压缩的源文件。
#   仓库仍是唯一事实源：本 workflow 只 `npm run build`，不在部署时改写任何生成物；
#   photos/manifest.json 的新鲜度由 sync-photos workflow 负责（生成并回写提交）。
#
# 前置条件（仓库设置，一次性）：Settings → Pages → Source = GitHub Actions。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一个部署，排队中的直接取消——避免旧产物把新产物覆盖回去。
# （官方 starter 用 false「让进行中的部署跑完」；本仓取 true：连推时只关心最终态，
#   被取消的中间 run 本就该作废，新 run 会部署最新提交，不存在半成品。）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 发布门禁：复用 CI 全量（照片 GPS/长边不变量 + lint + e2e + lhci），绿了才构建部署。
  # 为什么必须有：两条链原本各自 on: push、互不依赖——破坏性提交会先上线、CI 后报红；
  # 尤其 sanitize --check 失败拦不住含 GPS 的照片被发布（deploy 照样把 photos/ 拷进产物），
  # 直接违背「母版不带 GPS」的硬约束。用 workflow_call 复用 ci.yml 而非手写步骤副本：
  # 配置单源、不随 CI 演进而漂移。代价是 push 时测试执行两遍（两链并行，墙钟 ≈ CI 时长，
  # 线上更新延迟到门禁绿——这正是本 job 存在的意义）。
  gate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
