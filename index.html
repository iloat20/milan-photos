<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="米兰美术馆 · 摄影作品陈列：重点陈列轮播、展厅索引与观画室。" />
  <!-- 跟随系统外观：亮/暗两套主题各自声明主题色，地址栏/状态栏与页面同底 -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <link rel="canonical" href="https://iloat20.github.io/milan-photos/" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- 分享预览（微信 / X / Telegram 等抓取 og:*） -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="米兰美术馆" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:title" content="米兰美术馆 · 油画展厅" />
  <meta property="og:description" content="油画式摄影陈列：重点陈列轮播、展厅索引与库房入藏。" />
  <meta property="og:url" content="https://iloat20.github.io/milan-photos/" />
  <meta property="og:image" content="https://iloat20.github.io/milan-photos/assets/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="米兰美术馆展厅一角" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="米兰美术馆 · 油画展厅" />
  <meta name="twitter:description" content="油画式摄影陈列：重点陈列轮播、展厅索引与库房入藏。" />
  <meta name="twitter:image" content="https://iloat20.github.io/milan-photos/assets/og.jpg" />
  <meta name="twitter:image:alt" content="米兰美术馆展厅一角" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ImageGallery",
    "name": "米兰美术馆 · 油画展厅",
    "description": "油画式摄影陈列：重点陈列轮播、展厅索引与库房入藏。",
    "url": "https://iloat20.github.io/milan-photos/",
    "inLanguage": "zh-CN",
    "genre": ["摄影", "油画式陈列"],
    "provider": {
      "@type": "Organization",
      "name": "米兰美术馆"
    }
  }
  </script>

  <title>米兰美术馆 · 油画展厅</title>
  <!-- （Vite 起）手写 preload 已全部移除：src/*.js 由构建打进 app.js 单文件，不需要
       modulepreload；app.js / styles.css 的 <link rel="preload"> 也会被 Vite 当静态资源
       处理（实测：preload app.js 会复制出一份未压缩的 dist/assets/app.js，preload
       styles.css 则被静默删除）——入口脚本已在头部、样式表紧随其后，无需预载。 -->
  <!-- 清单请求提前到 HTML 解析期：等 app.js 下载完再发 fetch 会在模拟图里
       串出 app.js → manifest → 序厅图 的三跳链（LCP 的 Load Delay 实测 334ms，
       每跳 ~150ms）。这里先发，app.js 用 window.__milanManifest 消费同一 Promise，
       不重复请求；.catch 空接是防 app.js 启动前 rejection 冒 unhandledrejection。 -->
  <script>
    window.__milanManifest = fetch("photos/manifest.json", { cache: "no-store" });
    window.__milanManifest.catch(() => {});

    /* LCP 图（序厅首图）的预载也留在解析期 —— 不能交给 app.js。
       实测（4× CPU 节流，移动视口）：清单在 58ms 到手，但 app.js 的解析 + 执行
       要 ~180ms，其内联的 preloadImage 因此把高优先级图推迟到 270ms 才发起。
       内联脚本没法 import src/util.js，所以候选串由 sync 预算进 manifest
       （heroSrcset / heroAvifSrcset，与 palette 同一范式）：这里只搬运字符串，
       不重算任何规则。规则仍在 src/util.js 里，只在「清单是旧/降级版」时由
       app.js 的 preloadImage 兜底（两组值一致由 tests/unit/hero-srcset.test.mjs
       拿提交的 manifest 逐条钉住；imagesizes 与 HERO_SIZES 同值由同测试钉住）。 */
    window.__milanManifest
      /* 必须读**副本**：同一 Response 还要交给 app.js 消费（app.js 复用这个 Promise
         并 res.json()）。这里直接读原件会把 body 消费掉，app.js 随后拿到
         `TypeError: body stream already read` → folderPhotos 置空 → 全站静默白屏
         （展厅 0 卡 / 序厅 0 画面，且控制台零报错）。clone() 须在 body 被读前调用，
         此处顺序天然安全；回归由 tests/e2e/smoke.spec.js 的「只被消费一次」用例钉住。 */
      .then((res) => (res && res.ok ? res.clone().json() : null))
      .then((data) => {
        const first = data && (Array.isArray(data) ? data[0] : (data.photos || [])[0]);
        const srcset = first && (first.heroAvifSrcset || first.heroSrcset);
        if (!srcset) return; // 旧/降级清单：交给 app.js 兜底
        const link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        // href 是「不支持 imagesrcset 时的回退」，与 src/util.js 的 heroSrc 同序：
        // medium → thumb（动图没有 medium，因此与 heroSrc 的 thumb 分支同值）
        link.href = first.medium || first.thumb || first.src || "";
        link.setAttribute("imagesrcset", srcset);
        link.setAttribute("imagesizes", "min(86vw, 880px)");
        // 格式由字段名判定：heroAvifSrcset 只由 AVIF 候选拼成，首个候选必是 AVIF
        link.type = first.heroAvifSrcset ? "image/avif" : "image/webp";
        link.setAttribute("fetchpriority", "high");
        document.head.appendChild(link);
      })
      .catch(() => {});
  </script>
  <link rel="stylesheet" href="styles.css" />
  <!-- 入口脚本放头部：type="module" 默认 defer（不阻塞解析、解析完才执行），且头部
       的预加载扫描器最早发现它——等效于过去手写的 <link rel="preload" href="app.js">。
       不要再手写那条预载：Vite 会把 href 当静态资源，复制出一份未压缩的
       dist/assets/app.js（实测 68KB），预载反而去下载错误的文件。 -->
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="site-nav" id="siteNav">
    <div class="site-nav-inner">
      <a class="site-nav-logo" href="#">米兰美术馆</a>
      <nav class="site-nav-links" aria-label="馆内导航">
        <a href="#gallery">展厅</a>
        <a href="#about">前言</a>
        <a href="#archive">库房</a>
      </nav>
      <div class="site-nav-actions">
        <!-- 安装到桌面：默认隐藏。beforeinstallprompt 不是 Baseline（Firefox / iOS
             Safari 不派发），只有它真的到来才说明此刻这台浏览器可安装 —— 时序由
             src/install.js 负责，「默认隐藏」不能省（不支持时不该留一个死按钮）。 -->
        <button class="install-toggle" id="installBtn" type="button" aria-label="安装到桌面" title="安装到桌面" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3v11M7.5 9.5 12 14l4.5-4.5M4.5 17v2.5h15V17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
          <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <section class="hero-carousel" id="heroCarousel" aria-label="重点陈列" aria-roledescription="carousel">
    <div class="hero-plate" id="heroPlate">
      <h1 class="hero-title">米兰美术馆</h1>
    </div>
    <div class="hero-carousel-track" id="heroCarouselTrack"></div>
    <button class="hero-carousel-arrow hero-carousel-prev" id="heroPrev" type="button" aria-label="上一件">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="hero-carousel-arrow hero-carousel-next" id="heroNext" type="button" aria-label="下一件">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="hero-carousel-controls">
      <div class="hero-carousel-dots" id="heroCarouselDots" role="group" aria-label="重点陈列页码"></div>
      <button class="hero-carousel-pause" id="heroPause" type="button" aria-label="暂停自动轮播" aria-pressed="false" hidden>
        <svg class="hero-icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M9 6v12M15 6v12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <svg class="hero-icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M9 6.5 18 12l-9 5.5z" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div class="hero-carousel-progress" aria-hidden="true">
      <div class="hero-carousel-progress-bar" id="heroProgressBar"></div>
    </div>
  </section>

  <main>
    <section class="gallery-section chapter-room" id="gallery">
      <div class="chapter-head">
        <h2 class="chapter-title">展厅</h2>
      </div>
      <!-- role=group 而非 toolbar：toolbar 语义要求 roving tabindex + 左右方向键导航，
           这里是一组 aria-pressed 切换按钮、全部在 Tab 序列内，故用 group 更贴实。 -->
      <div class="filter-bar" id="filterBar" role="group" aria-label="展厅索引"></div>
      <div class="gallery-skeleton" id="gallerySkeleton" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="gallery" id="galleryGrid"></div>
      <p class="empty" id="empty" hidden>展厅尚未布展。将图片放入 <code>photos/</code> 后刷新，或到库房登记入藏。</p>
    </section>

    <section class="about chapter-room-deep" id="about">
      <div class="about-inner">
        <h2 class="about-title">像油画一样<br />被观看。</h2>
        <a class="btn btn-text" href="#gallery">进入展厅</a>
      </div>
    </section>

    <section class="upload-section" id="upload">
      <div class="upload-inner">
        <h2 class="upload-title" id="archive">库房</h2>
        <button class="btn btn-outline" type="button" id="addPhotoBtn">登记入藏</button>
        <input type="file" id="photoInput" accept="image/*" multiple hidden />
        <p class="upload-status" id="uploadStatus" role="status" aria-live="polite"></p>

        <!-- 库房设置面板：popover（top layer + light dismiss + 原生 Esc），不再是 <details>。
             面板不再挤占流内空间、点外部/按 Esc 即关都是 UA 行为，无需 JS。
             CSS 侧默认 display:none 是**刻意的兜底**：不支持 popover 的浏览器只是打不开它，
             而不会变成一块「opacity:0 却仍可聚焦」的隐形表单。 -->
        <button class="btn btn-ghost gh-toggle" type="button" id="ghToggle"
          popovertarget="ghPanel">同步馆藏数据到 GitHub</button>

        <div class="gh-panel" id="ghPanel" popover>
          <div class="gh-fields">
            <label class="gh-field">
              <span>仓库</span>
              <input type="text" id="ghRepo" value="iloat20/milan-photos" spellcheck="false" autocomplete="off" />
            </label>
            <label class="gh-field">
              <span>分支</span>
              <input type="text" id="ghBranch" value="main" spellcheck="false" autocomplete="off" />
            </label>
            <label class="gh-field">
              <span>Token（contents 写权限）</span>
              <input type="password" id="ghToken" placeholder="ghp_… 或 fine-grained PAT" autocomplete="off" spellcheck="false" />
            </label>
            <div class="gh-actions">
              <button class="btn btn-outline" type="button" id="ghSaveBtn">保存设置</button>
              <button class="btn btn-ghost" type="button" id="ghClearBtn">清除</button>
            </div>
            <p class="gh-hint">
              在 GitHub → Settings → Developer settings → Personal access tokens 创建，
              勾选 <code>repo</code>（classic）或本仓库 <code>Contents: Read and write</code>（fine-grained）。
              Token 只存在这台设备的浏览器里。
            </p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <p class="footer-museum">米兰美术馆</p>
      </div>
      <p class="footer-copy">© 2026 米兰美术馆</p>
    </div>
  </footer>

  <!-- 离线提示：内容是 JS 写入的（app.js 的 syncOfflineNote），无常驻文字 ——
       live region 靠「文本变化」播报，因此这里保持空节点，显示/隐藏走 body.is-offline。
       不常驻文字也避免未离线时被辅助技术读到一句和现实相反的话。 -->
  <p class="offline-note" id="offlineNote" role="status" aria-live="polite"></p>

  <dialog class="lightbox" id="lightbox" aria-label="观画室">
    <div class="lightbox-chrome">
      <button class="lb-close" id="close" type="button" aria-label="关闭观画室">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false">
          <path d="M1 1l12 12M13 1L1 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <figure class="lightbox-stage">
      <button class="lb-arrow lb-prev" id="prev" type="button" aria-label="上一件">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="lightbox-frame">
        <picture>
          <source id="lbSource" type="image/avif" srcset="" />
          <img class="lightbox-img" id="lbImg" alt="" />
        </picture>
      </div>
      <button class="lb-arrow lb-next" id="next" type="button" aria-label="下一件">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </figure>
    <div class="lightbox-meta">
      <h2 class="lb-title" id="lbTitle"></h2>
    </div>
  </dialog>

  <!-- 入口脚本已移入 <head>（见其处注释）：模块默认 defer，头部与 body 尾执行时机一致，
       而头部能被预加载扫描器更早发现。 -->
</body>
</html>
