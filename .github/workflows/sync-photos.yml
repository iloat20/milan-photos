name: Sync photo manifest

on:
  push:
    paths:
      - "photos/**"
      - "tools/sync_photos.py"
      - "tools/photos_lib.py"
      - ".github/workflows/sync-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install "Pillow>=11"
      - name: Generate manifest + thumbs
        run: python tools/sync_photos.py
      - name: Commit if changed
        run: |
          git add photos/manifest.json photos/thumbs photos/medium
          # 新生成的 avif 是 untracked，工作区 git diff 看不见——必须 add 后比 index
          if git diff --cached --quiet -- photos/manifest.json photos/thumbs photos/medium; then
            echo "manifest/thumbs/medium unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync photos manifest, thumbs and medium"
            git push
          fi
